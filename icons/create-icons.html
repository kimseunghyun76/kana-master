<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아이콘 생성기</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
  canvas { margin: 10px; border: 1px solid #ccc; border-radius: 4px; }
  .btn { padding: 12px 24px; background: #e63946; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 16px; }
  .btn:hover { background: #c1121f; }
  p { color: #666; margin-bottom: 20px; }
</style>
</head>
<body>
<h2>かな学習 - 아이콘 생성기</h2>
<p>아래 버튼을 클릭하면 아이콘 PNG 파일 3개가 자동으로 다운로드됩니다.<br>
다운로드된 파일들을 이 <code>icons/</code> 폴더에 저장해주세요.</p>

<div id="canvases"></div>
<button class="btn" onclick="generateAll()">🎨 아이콘 생성 + 다운로드</button>

<script>
function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // 배경 그라디언트
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#e63946');
  grad.addColorStop(1, '#c1121f');
  ctx.fillStyle = grad;

  // 둥근 사각형
  const r = size * 0.22;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // 글자 "か"
  ctx.fillStyle = 'white';
  ctx.font = `bold ${size * 0.62}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('か', size / 2, size / 2 + size * 0.03);

  // 작은 장식 점
  if (size >= 48) {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(size * 0.78, size * 0.25, size * 0.05, 0, Math.PI * 2);
    ctx.fill();
  }

  return canvas;
}

function downloadCanvas(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function generateAll() {
  const sizes = [16, 48, 128];
  const names = ['icon16.png', 'icon48.png', 'icon128.png'];
  const container = document.getElementById('canvases');
  container.innerHTML = '';

  sizes.forEach((size, i) => {
    const canvas = drawIcon(size);
    container.appendChild(canvas);
    setTimeout(() => downloadCanvas(canvas, names[i]), i * 300);
  });

  setTimeout(() => {
    alert('3개의 아이콘 파일이 다운로드되었습니다!\nicons/ 폴더에 저장해 주세요.');
  }, 1200);
}

// 미리보기
window.onload = () => {
  const container = document.getElementById('canvases');
  [16, 48, 128].forEach(size => {
    const canvas = drawIcon(size);
    const label = document.createElement('div');
    label.style.display = 'inline-block';
    label.style.textAlign = 'center';
    label.style.margin = '10px';
    label.innerHTML = `<div>${size}×${size}</div>`;
    label.prepend(canvas);
    container.appendChild(label);
  });
};
</script>
</body>
</html>
