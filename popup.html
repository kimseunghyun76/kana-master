<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본어 마스터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #0f172a; color: #f1f5f9;
    }
    .header {
      padding: 20px 16px 16px;
      background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);
      display: flex; align-items: center; gap: 12px;
    }
    .logo {
      width: 44px; height: 44px; border-radius: 14px;
      background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700;
      font-family: 'Noto Sans JP', serif;
    }
    .title h1 { font-size: 17px; font-weight: 800; }
    .title p  { font-size: 12px; opacity: .75; margin-top: 1px; }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 1px; background: #334155;
    }
    .stat {
      background: #1e293b; padding: 14px 8px; text-align: center;
    }
    .stat-num { font-size: 22px; font-weight: 800; line-height: 1; }
    .stat-label { font-size: 10px; color: #64748b; margin-top: 4px; font-weight: 500; }
    .stat-num.xp { color: #818cf8; }
    .stat-num.streak { color: #f59e0b; }
    .stat-num.done { color: #10b981; }
    .open-btn {
      width: calc(100% - 24px);
      margin: 14px 12px 0;
      padding: 14px;
      background: #6366f1; border: none; border-radius: 12px;
      color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px;
      transition: background .2s;
    }
    .open-btn:hover { background: #5254cc; }
    .next-module {
      margin: 10px 12px;
      padding: 12px 14px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 10px;
      font-size: 12px; color: #94a3b8;
    }
    .next-module .nm-label { font-size: 10px; color: #64748b; margin-bottom: 4px; }
    .next-module .nm-name { font-size: 13px; font-weight: 700; color: #f1f5f9; }
    .footer {
      padding: 12px 12px 14px;
      text-align: center;
      font-size: 11px; color: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">日</div>
    <div class="title">
      <h1>일본어 마스터</h1>
      <p>Japanese Master v2</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num xp" id="popXP">0</div>
      <div class="stat-label">⚡ XP</div>
    </div>
    <div class="stat">
      <div class="stat-num streak" id="popStreak">0🔥</div>
      <div class="stat-label">연속 일수</div>
    </div>
    <div class="stat">
      <div class="stat-num done" id="popDone">0</div>
      <div class="stat-label">완료 모듈</div>
    </div>
  </div>

  <div class="next-module">
    <div class="nm-label">다음 학습</div>
    <div class="nm-name" id="popNext">히라가나부터 시작하세요 →</div>
  </div>

  <button class="open-btn" id="openApp">
    📖 학습 시작하기
  </button>

  <div class="footer">일본어 마스터 v2.0 · Stage-based Learning</div>

  <script>
    const KEY = 'jp_master_v2';
    function load() {
      try {
        if (typeof chrome !== 'undefined' && chrome.storage) {
          chrome.storage.local.get(KEY, r => update(r[KEY] || {}));
        } else {
          const raw = localStorage.getItem(KEY);
          update(raw ? JSON.parse(raw) : {});
        }
      } catch(e) { update({}); }
    }
    function update(data) {
      document.getElementById('popXP').textContent = data.xp || 0;
      document.getElementById('popStreak').textContent = (data.streak || 0) + '🔥';
      const mods = Object.values(data.modules || {});
      document.getElementById('popDone').textContent = mods.filter(m => m.stepsCompleted > 0).length;
    }
    document.getElementById('openApp').addEventListener('click', () => {
      if (typeof chrome !== 'undefined' && chrome.tabs) {
        chrome.tabs.create({ url: chrome.runtime.getURL('index.html') });
      } else {
        window.open('index.html', '_blank');
      }
    });
    load();
  </script>
</body>
</html>
